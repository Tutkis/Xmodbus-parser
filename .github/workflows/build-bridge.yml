name: Build modbus-bridge binaries

on:
  push:
    tags: ['v*']
    paths:
      - 'mini-services/tcp-bridge-rust/**'
      - '.github/workflows/build-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: modbus-bridge-linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: modbus-bridge-linux-arm64
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: modbus-bridge-windows-x64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: modbus-bridge-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: modbus-bridge-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross == true
        run: cargo install cross

      - name: Build
        working-directory: mini-services/tcp-bridge-rust
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Rename artifact
        shell: bash
        run: |
          cd mini-services/tcp-bridge-rust/target/${{ matrix.target }}/release
          # Find the binary (modbus-bridge or modbus-bridge.exe)
          BIN=$(ls modbus-bridge* 2>/dev/null | head -1)
          if [ -z "$BIN" ]; then echo "Binary not found!"; exit 1; fi
          cp "$BIN" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: mini-services/tcp-bridge-rust/target/${{ matrix.target }}/release/${{ matrix.artifact }}

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mini-services/tcp-bridge-rust/target/${{ matrix.target }}/release/${{ matrix.artifact }}
          fail_on_unmatched_files: false
