[package]
name = "modbus-tcp-bridge"
version = "0.3.3"
edition = "2021"
description = "WebSocket-to-TCP bridge for browser-based Modbus TCP live capture with network scanner"
license = "MIT"
repository = "https://github.com/Tutkis/Xmodbus-parser"

[[bin]]
name = "modbus-bridge"
path = "src/main.rs"

[dependencies]
# Async runtime + WebSocket + TCP
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Local IP detection for network scan
if-addrs = "0.13"
# Logging
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
log = "0.4"

[profile.release]
# Aggressive size optimization for small binary
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
