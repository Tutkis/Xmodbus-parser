<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Stylized "M" for Modbus -->
  <path d="M 128 384 L 128 160 L 192 160 L 256 280 L 320 160 L 384 160 L 384 384 L 320 384 L 320 248 L 256 360 L 192 248 L 192 384 Z"
        fill="#ffffff" opacity="0.95"/>
  <!-- Hex byte chips below -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" text-anchor="middle">
    <rect x="96" y="410" width="64" height="32" rx="6" fill="#fbbf24"/>
    <text x="128" y="432" font-size="18" fill="#1a1a1a">01</text>
    <rect x="168" y="410" width="64" height="32" rx="6" fill="#10b981"/>
    <text x="200" y="432" font-size="18" fill="#ffffff">03</text>
    <rect x="240" y="410" width="64" height="32" rx="6" fill="#a78bfa"/>
    <text x="272" y="432" font-size="18" fill="#ffffff">00</text>
    <rect x="312" y="410" width="64" height="32" rx="6" fill="#f43f5e"/>
    <text x="344" y="432" font-size="18" fill="#ffffff">0A</text>
    <rect x="384" y="410" width="32" height="32" rx="6" fill="#dc2626"/>
    <text x="400" y="432" font-size="18" fill="#ffffff">CRC</text>
  </g>
</svg>
